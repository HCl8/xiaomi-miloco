name: PR Review (self-hosted)

# 自托管审查路径：与 pr-review.yml 同一个门禁脚本，只把 runs-on 指向自托管 runner
# 且不声明 container:（容器由启动器起）。用 pull_request 而非 pull_request_target：
# PR 都来自本仓分支；改用后者前须先解决下方 concurrency 的双写者问题。
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# ⚠️ 切到自托管之前必须先下线线上「每个 PR 各跑一次」的路径。两条路径并发审同一个 PR 时
# 共用 review-pr-ci 评论和同一个 pr-review status context，而门禁「跑前记评论更新时间、
# 跑完比一次」的前提是这条评论只有本次审查会写，并发时前提不成立。
#
# 同一 PR 连续 push 时取消上一次审查，只留最新。自托管下每个作业各起独立容器，
# 「一个 runner 一次一个作业」的串行保证不成立；并发审查会互相覆盖唯一那条
# review-pr-ci 评论，门禁读到的可能是另一个 commit 的结论。
concurrency:
  # 组名必须与线上那份（pr-review-<号>）**不同** —— concurrency 组是仓库级全局的，
  # 同名时两份会互相取消。
  group: pr-review-selfhosted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # review-pr --ci 要发/改 PR 评论
  statuses: write       # 把结论打成 pr-review commit status

jobs:
  review:
    # 认专属标签，避免被 GitHub 托管的机器接走
    runs-on: [self-hosted, prr-test]
    timeout-minutes: 60
    # 三重守卫：草稿不审（靠 ready_for_review 补审）、fork 不审、手动触发放行（单写
    # draft == false 会一并挡掉）。⚠️ 不是安全边界：pull_request 取 PR 那一侧的工作流
    # 文件，fork 可以改掉它；真正的边界在容器层与仓库的 fork 审批设置。
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: 允许 git 访问工作区
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: AI 审查并按严重度门禁
        env:
          GH_TOKEN: ${{ github.token }}
          # 同「定 PR 编号」：输入值不能当代码执行（手动触发时 pr 是自由文本）。
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # 刻意不声明 ANTHROPIC_* / PR_AGENT_MODEL：由宿主机启动器注入容器（地址指向
          # 宿主机模型代理，容器只拿假钥匙）。声明空值会覆盖掉注入值。
        run: |
          git fetch origin main

          # 跑 base 分支上的门禁脚本（单一来源）；用 git show 取 origin/main 版本，
          # PR 改不动这段判定逻辑。
          if git show origin/main:.ci/pr-review-gate.sh \
            | bash -s -- "$PR_NUM" "$REPO"; then
            STATE=success
            DESC="未发现严重/重要问题"
          else
            STATE=failure
            DESC="发现严重/重要问题"
          fi

          # 结论打在 PR **head** 的 commit 上，不能打在工作区 HEAD —— checkout 的是
          # refs/pull/<n>/merge（现算的合并提交，会变），且 check 全挂在 head 上。
          # 打错地方既不显示在 PR 上，也当不了 required check。
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq .head.sha)
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context="pr-review" -f description="$DESC" >/dev/null

          [ "$STATE" = success ]
