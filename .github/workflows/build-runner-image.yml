name: Build Runner Image

# 构建"一次性审查容器"的镜像（runner 底座 + 审查环境），多架构，推 ghcr。
#
# 为什么构建放 CI、不放运行机本地：运行机到上游安装源的 TLS 链在容器里验不过
# （实测报 `unable to get local issuer certificate`），取不到审查 CLI。
# 放 CI 做还顺带两个好处：镜像可复现、可审计；运行机只剩"取镜像"一件事。
#
# 分发只有一条路：**ghcr**。运行机 `container image pull` 一条命令就够，而且能按 digest
# 钉住（配置里写 `<镜像>@sha256:...`）—— 也不像 artifact 那样有保留期。前提是包可读：
# 公开仓出来的镜像没有秘密，把包设成 public，运行机就零凭据。
on:
  workflow_dispatch:
  push:
    branches: [prr-smoke]
    paths:
      - ".ci/Dockerfile.pr-runner"
      - ".ci/pr-agent.sh"
      - ".ci/runner-entrypoint.sh"
      - ".github/workflows/build-runner-image.yml"

permissions:
  contents: read
  packages: write     # 推 ghcr

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # ghcr 的镜像名必须全小写，而 GitHub 用户名可能有大写
      - name: 算镜像名
        id: img
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/prr-review" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .ci/Dockerfile.pr-runner
          # 留两个架构：运行机是 arm64，但保留 amd64，换机器时不用改构建
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=prr-review
          cache-to: type=gha,mode=max,scope=prr-review
