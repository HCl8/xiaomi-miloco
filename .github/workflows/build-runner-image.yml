name: Build Runner Image

# 构建"一次性审查容器"的镜像（runner 底座 + 审查环境），推 ghcr，并额外产出一份 OCI tar 当 artifact。
#
# 为什么构建放 CI、不放运行机本地：运行机到上游安装源的 TLS 链在容器里验不过
# （实测报 `unable to get local issuer certificate`），取不到审查 CLI。
# 放 CI 做还顺带两个好处：镜像可复现、可审计；运行机只剩"取镜像"一件事。
#
# 为什么同时给 OCI tar：registry 上的包默认私有，运行机要 pull 就得有带 read:packages 的凭据。
# tar 走仓库自己的 artifact，用仓库现有 token 就能取，不必动包的可见性。
# 两条路并存——registry 那条更强（能按 digest 钉住），tar 这条零配置。
on:
  workflow_dispatch:
  push:
    branches: [prr-smoke]
    paths:
      - ".ci/Dockerfile.pr-runner"
      - ".ci/pr-agent"
      - ".ci/runner-entrypoint.sh"
      - ".github/workflows/build-runner-image.yml"

permissions:
  contents: read
  packages: write     # 推 ghcr

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # ghcr 的镜像名必须全小写，而 GitHub 用户名可能有大写
      - name: 算镜像名
        id: img
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/prr-review" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 多架构推 registry：amd64 供云端兜底路径，arm64 供自托管运行机
      - name: 构建并推 registry
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .ci/Dockerfile.pr-runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=prr-review-multi
          cache-to: type=gha,mode=max,scope=prr-review-multi

      # 同一份 Dockerfile 再出一份 arm64 的 OCI tar。缓存命中，所以这一步很快。
      # 运行机拿它 `container image load`，全程不需要 registry 凭据。
      # tags 必须给：不给的话 load 进去是个无名镜像，启动器没法引用它。
      - name: 导出 arm64 OCI tar
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .ci/Dockerfile.pr-runner
          platforms: linux/arm64
          tags: prr-review:latest
          outputs: type=oci,dest=/tmp/prr-review-arm64.tar
          cache-from: type=gha,scope=prr-review-multi

      - name: 上传 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prr-review-arm64-oci
          path: /tmp/prr-review-arm64.tar
          retention-days: 14
          if-no-files-found: error
