name: Runner Isolation Probe

# 目的：把"任务跑在一次性容器里、容器碰不到宿主以外的网络"这几条说法，变成可以自己跑的实测。
# 触发方式本身也是安全设计：只留维护者能发起的方式，**绝不接 pull_request_target**——
# 否则外部人就能反复往这台机器投递任务。
on:
  workflow_dispatch:
  push:
    branches: [prr-smoke]

permissions:
  contents: read

jobs:
  probe:
    # 认专属标签，避免被 GitHub 托管的机器接走
    runs-on: [self-hosted, prr-test]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # 断言本体只有一份：仓库里的 .ci/self-hosted-runner/probe.sh。
      # 这里以前内联了同一套断言的副本，两份漂移过 —— 同一台机器、同一个坏状态，
      # 手工跑脚本会打「全部通过」，而这里 FAIL。改成调脚本，这类漂移从结构上不可能再发生。
      - name: 逐条断言
        env:
          # 容器唯一的出口：容器网络里宿主机的网关地址
          HOST_GW: "192.168.100.1"
          GH_PROXY_PORT: "18080"
          MODEL_PROXY_PORT: "18081"
          # 一个保证不可路由的保留地址（RFC 5737 的 TEST-NET-1）：能连上就说明有路由泄漏。
          # 刻意不写任何真实网络地址 —— 这个文件在公开仓里。
          PRR_INTRANET_TARGET: "192.0.2.1"
        run: bash .ci/self-hosted-runner/probe.sh
