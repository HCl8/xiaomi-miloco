# 维护者手动触发的 PR 审查：在 PR 评论里发 "/review" 即对该 PR 跑一次审查。
# 用途：维护者手动对任意 PR（含 fork）跑审查；在 base 仓上下文里通过 issue_comment 触发。
# 安全边界 = 评论者须有 write+ 权限 + 钉死触发时刻的 head SHA。
#
# 用哪条 runner 由**触发那一刻有没有正在跑的自托管任务**决定：
#   有（排队中 / 在跑）→ 取消它，等它真的停下，然后改用公共 runner
#   没有              → 用自托管 runner
# 这样"机器挂了、作业卡在队列里"时，维护者发一句 /review 就能切到公共 runner，
# 而不需要去仓库设置里手动开关 workflow（那种开关一开就是全仓生效，还会留下两个写者）。
name: PR Review (command)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write # 发 / 改 review-pr-ci 评论、加 reaction
  statuses: write # 把门禁结论打到 head SHA 的 commit status
  actions: write # 取消进行中的自托管审查任务
  packages: read # 拉 ghcr 上的审查镜像

concurrency:
  group: pr-review-cmd-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  # 轻量授权门：用评论自带的 author_association 判定（OWNER/MEMBER/COLLABORATOR=可信内部人），
  # 挡住外部贡献者在自己 fork PR 下自助触发带 key 的流程。
  # 用 author_association 而非 `gh api collaborators/<user>/permission`：后者权限要求在 org 仓不确定，
  # token 不足时会对所有人 403→静默拒绝；author_association 是 webhook 自带字段，无 API、无 token 依赖。
  # 注：MEMBER 含只读 org 成员（比"对本仓有 write"略宽），对"挡外部人"这个目标足够。
  authorize:
    if: >-
      github.event.issue.pull_request != null
      && startsWith(github.event.comment.body, '/review')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.gate.outputs.head_sha }}
      matched: ${{ steps.check.outputs.matched }}
      where: ${{ steps.route.outputs.where }}
    steps:
      - name: 校验评论命令
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          BODY="$(printf '%s' "$COMMENT_BODY" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ "$BODY" = "/review" ] || printf '%s' "$BODY" | grep -q '^/review '; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
            SAFE_BODY="$(printf '%s' "$BODY" | tr '\n' ' ')"
            echo "::notice::跳过：评论内容不匹配 /review 命令（trim 后为: ${SAFE_BODY}）"
          fi

      - name: 钉死 head SHA
        if: steps.check.outputs.matched == 'true'
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          # 钉死触发此刻的 head SHA：维护者背书的是这个 commit，审查也必须审它（防触发后被换包）
          HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # 决定走哪条 runner，并清掉会让两条路径同时写的那个前提
      - name: 决定用哪条 runner
        if: steps.check.outputs.matched == 'true'
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          # 这个 PR 上还没结束的自托管审查任务。判据是 `.status != "completed"`，
          # **不能只列 queued / in_progress**：GitHub 还有 pending / requested / waiting
          # 这些中间态（触发后、被 runner 领走前就是 pending），漏掉它们会让取消落空。
          active() {
            gh api "repos/$REPO/actions/runs?per_page=100" --paginate \
              --jq '[.workflow_runs[]
                     | select(.path == ".github/workflows/pr-review-selfhosted.yml")
                     | select(any(.pull_requests[]?; .number == '"$PR"'))
                     | select(.status != "completed")
                     | .id] | .[]' 2>/dev/null
          }
          ids="$(active || true)"
          if [ -z "$ids" ]; then
            echo "没有进行中的自托管任务 → 用自托管 runner"
            echo "where=self" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "发现进行中的自托管任务，先取消："
          printf '%s\n' "$ids" | while read -r id; do
            [ -n "$id" ] || continue
            echo "  run $id"
            gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null 2>&1 || true
          done
          # **必须等它真的停下**：取消是异步的。不等就往下走，那一刻两个写者同时存在，
          # 共用一条 review-pr-ci 评论和同一个 pr-review status，门禁的防假绿判定会失效。
          for _ in $(seq 1 30); do
            [ -z "$(active)" ] && break
            sleep 2
          done
          left="$(active || true)"
          if [ -n "$left" ]; then
            echo "::error::取消后仍有任务未停下（$left），为免两个写者同时存在，本次中止；稍后重发 /review"
            exit 1
          fi
          echo "已全部停下 → 改用公共 runner"
          echo "where=cloud" >> "$GITHUB_OUTPUT"

      - name: 回应 👀 表示已收到
        if: success() && steps.check.outputs.matched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes >/dev/null 2>&1 || true

  # 自托管：容器由启动器提供，模型地址与假钥匙也由它注入 —— 这里**刻意不声明** ANTHROPIC_*，
  # 声明空值会把注入的值覆盖掉。
  review_self:
    needs: authorize
    if: needs.authorize.outputs.matched == 'true' && needs.authorize.outputs.where == 'self'
    runs-on: [self-hosted, prr-test]
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: 审查并按严重度门禁
        env:
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin main
          git show origin/main:.ci/pr-review-run.sh | bash -s -- "$PR" "$HEAD_SHA" "$REPO"

  # 公共 runner：审查环境来自 ghcr 上的镜像，模型凭据来自仓库 secrets。
  review_cloud:
    needs: authorize
    if: needs.authorize.outputs.matched == 'true' && needs.authorize.outputs.where == 'cloud'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/xiaomi/xiaomi-miloco/pr-review:trixie
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      PR_AGENT_MODEL: ${{ vars.PR_AGENT_MODEL }}
      ANTHROPIC_FALLBACK_API_KEY: ${{ secrets.ANTHROPIC_FALLBACK_API_KEY }}
      ANTHROPIC_FALLBACK_BASE_URL: ${{ secrets.ANTHROPIC_FALLBACK_BASE_URL }}
      PR_AGENT_FALLBACK_MODEL: ${{ vars.PR_AGENT_FALLBACK_MODEL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: 审查并按严重度门禁
        env:
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin main
          git show origin/main:.ci/pr-review-run.sh | bash -s -- "$PR" "$HEAD_SHA" "$REPO"
