# miloco 后端默认配置
#
# 加载优先级（高 → 低）：
#   环境变量（MILOCO_* / MILOCO_SERVER__URL 等）
#   > $MILOCO_HOME/config.json（用户可编辑，结构见 settings.schema.json）
#   > 本文件（后端默认值）
#   > 代码默认值

# 是否启用调试模式
debug: false

# 目录配置（storage 相对路径基于 $MILOCO_HOME 解析）
directories:
  static: "static"    # 后端静态资源目录（相对后端源码 root）
  storage: "."        # 工作目录；"." 表示直接使用 $MILOCO_HOME
  models: "models"          # ONNX 模型目录；为空时默认 $MILOCO_HOME/models

# 多模态大模型（omni）默认配置
# - omni：当前生效配置（引擎兜底默认，住户在 web「模型」页配好 api_key / 换模型即覆盖）
# - omni_profiles：web「模型」页可切换的档案列表；不预置任何档案，由住户自行新增
# - api_key 一律留空，由住户在 web「模型」页填写(本文件不存任何密钥)；env / config.json 可覆盖
model:
  omni:
    label: "mimo"
    model: "mimo-v2.6-flash"
    base_url: "https://api.xiaomimimo.com/v1"
    api_key: ""
  omni_profiles: []

# miloco 后端服务相关配置
server:
  host: "127.0.0.1"                                            # 后端监听 host(默认仅本机;开 LAN 改 0.0.0.0,详见 settings.py 注释)
  port: 1810                                                   # 后端监听端口
  log_level: "info"                                            # uvicorn 日志级别
  enable_console_logging: true                                 # 是否启用控制台日志
  # HTTPS / TLS 已废弃：backend 永远 HTTP，跨网加密走反代（nginx / cloudflare-tunnel）+ 真证书。
  # 旧 tls_certfile / tls_keyfile 字段保留，但写了也不生效（uvicorn 启动会打 deprecation warning）。

# SQLite 数据库连接参数
database:
  path: "miloco.db"          # 数据库文件（相对 storage 或绝对路径）
  timeout: 30.0              # 连接超时（秒）
  check_same_thread: false   # 是否强制单线程访问
  isolation_level: null      # 事务隔离级别；null 表示默认

# FastAPI 应用元信息
app:
  title: "Miloco backend"
  service_name: "miloco-backend"
  description: "Miloco backend, responsible for scheduling various modules"
  # version 不在此硬编码：运行时由 AppSettings._resolve_version() 读已安装包元数据
  # （env MILOCO_APP__VERSION / config.json 仍可覆盖）

# MIoT 云接入参数（可选值：cn / de / i2 / ru / sg / us）
miot:
  cloud_server: "cn"
  # 本地中枢网关总开关。false = 完全禁用（不签证书/不 mDNS/不连网关），控制全走云端。
  central_hub_enabled: true
  # 静态中枢网关地址：mDNS 发现不到时用（如容器/跨网段隔离，组播过不去）。
  # 每项 "ip" 或 "ip:port"（默认端口 8883）。留空则仅靠 mDNS 自动发现。
  central_hub_gateways: []
  # central_hub_gateways:
  #   - "192.168.1.152"

# 通知发送运行参数
notify:
  dedup_window_sec: 60   # 相同通知文案在此窗口(秒)内只发一次；<=0 关闭去重

# 摄像头采集参数
camera:
  frame_interval: 1000   # 帧采集间隔（毫秒）
  max_cache_images: 6    # 最大缓存图像数量

# 规则引擎相关配置
rule:
  log_ttl: 30                  # 天
  default_duration_ratio: 0.6  # 已废弃：旧 duration 滑窗比例，仅为配置兼容保留

# 感知管线配置
perception:
  log_ttl: 30                  # 感知日志保留天数
  tier_u_dump_enable: false    # POST /api/identity/pool/dump 调试端点开关（生产保持 false，本地调试可设 true）
  collect:
    window_size: 4           # 时间窗口大小（秒）
    max_windows: 3           # 最大待处理窗口数
    settle_ms: 500           # 等待慢轨道的宽限期（毫秒）
    full_action: "clear"     # 窗口满载处理策略：drop | clear | keep
  engine:
    input:
      # 帧率旋钮集中在此一处(对应 InputConfig):
      #   fps      —— 下发/pipeline 帧率 = tracker 帧率(下采后 tracker 逐帧消费全部)
      #   omni_fps —— 送 omni 的视频帧率, 与 fps 解耦; omni 已是瓶颈, 不随 tracker 提频涨
      fps: 3
      omni_fps: 1
      video_short_edge: 512
      omni_visual_input_mode: video
    # Smart Crop(智能裁切增强): 推理前定向裁切活动区域, 送更高等效分辨率的局部视频 + 全景参考帧。
    # 与 video_short_edge 正交 —— 裁不裁看这里, 多清晰看 video_short_edge; crop 视频等比放到
    # 逐轴贴住同档全景画面、参考帧只缩不放, 都跟着用户档走。热读、免重启。
    crop_enhance:
      # 双闸:enabled = 发版级开关(本文件随包发布、不由 admin API 写,只能改文件;false 时
      #       整个能力关掉、前端开关随之置灰);
      #       user_enabled = 单机用户开关(UI「智能裁切增强」,admin API 写 config.json)。
      #       本文件这两个是**全局**闸,都为 true 只是必要条件 —— 还要该机位自己的
      #       per-camera 闸也开(KV CAMERA_CROP_DENY_LIST_KEY,deny-list/默认开,
      #       用 `miloco-cli scope camera crop-on/crop-off` 逐路配),三闸相与才裁。
      #       分两个 key 不是访问控制(本地部署拦不住),是配置层不同,
      #       见 perception/engine/config.py::CropEnhanceConfig 的 docstring。
      # 两闸默认放开(per-camera 闸的默认也是开,空集=全开):未改过 config.json /
      # 未动 UI 开关 / 未逐机位关过的用户默认启用 Smart Crop。
      # 关闭任一闸即回退全景路径(不再裁切),但**不等于**字节回到未接本特性前 —— 全景与 crop
      # 共用 _encode_video_mp4,其放大分支的重采样核已随本特性换成 LANCZOS4(源短边 < 用户档
      # 时命中,如 720p 子码流 + 768/1080 档),故关闸后全景 clip 字节仍与接特性前不同。
      enabled: true
      user_enabled: true
      expand_ratio_h: 0.40
      expand_ratio_v: 0.30
      motion_diff_threshold: 40
      motion_min_block_ratio: 0.005
      motion_min_fill_ratio: 0.2
      motion_global_drift_ratio: 0.5
      crop_min_area_ratio: 0.10
      crop_max_area_ratio: 0.49
    person_crop_inject:
      # 单帧人像注入:给每个待识别 track 附一张从本窗视频里裁出的"外观单帧"、绑定 track_id。
      # 离线评测(主指标 = 多人同框逐窗召回,配对 McNemar)显示显著提升,在已开 Smart Crop 的
      # 条件下仍然可观;代价是误识率有方向性上升,压回基线另有专项。
      # 单闸(不像 crop_enhance 是双闸):本能力没有 UI 入口,详见
      # perception/engine/config.py::PersonCropInjectConfig 的 docstring。
      # 每窗热读(不在建引擎时快照),但 get_settings() 有进程级 lru_cache、本能力又没有 admin/UI
      # 入口去清它,所以手改本文件或 config.json 不会当场生效。关闸走 CLI:
      #   miloco-cli config set perception.engine.person_crop_inject.enabled false
      # (写 config.json 并默认顺手重启后端)。关闸即退化为只给 bbox 数字坐标。
      enabled: true
      # 256 是评测扫出来的效率前沿:往下掉得快且显著,往上检测不到增益却要 12.5× token。
      crop_height: 256
      # 原生框高低于此值的帧不参与选帧(远处小框放大只得到一张糊图);末帧兜底同样过这道闸 ——
      # 否则全窗都是小框时它恰好失效,只把选帧从"窗内最大"降级成"末帧",清晰度一点没变。
      min_bbox_height_px: 40
    gate:
      # visual 滞回时长(秒)。visual 最近通过过、距今 <= 此值时,本窗 visual 不通过
      # 也强制生成 packet 并打 hold 标志,保住 video 路由不被纯音频短路。
      # 0 = 关闭 hold。过长在画面间歇有变化的场景会持续续命窗口、期间静默窗也被
      # 拉起跑下游 omni,浪费调用;过短则人短暂静止时 video 路由会切走。
      hold_duration_sec: 0        # 2.4 取消 hold；状态维持交给 state_memory 状态容器
      # 二级语义门禁(本地 StartLux-Decision sidecar,仅 Apple Silicon)。视觉门禁放行后
      # 再问一次"本窗有没有新事件",决定要不要调 omni。默认关;sidecar 不可达时调用失败
      # 会自动 fail-open(放行),不会导致漏事件。
      semantic:
        enabled: false
        # shadow = 只算分写 traces.timing_detail,不改变路由;enforce = 分数不过阈值就拦。
        mode: enforce
        base_url: "http://127.0.0.1:8090"
        timeout_sec: 10.0
        # 0.35 = 通用「活动级事件」提示词的折中：60 窗人工标注 6/6 召回、
        # 加权通过 22%、精度 32%；0.4 开始丢真变化，0.2 放进太多姿势/背景小动作。
        min_score: 0.35
        # 特殊放行问题(规则/档案经 LLM 提炼)的阈值，与默认问题分开调。
        extra_min_score: 0.2
        frames: 4              # 本窗抽样帧数(不含参考帧)
        image_short_edge: 360
        jpeg_quality: 90
        max_concurrency: 2     # 多相机同时判时,sidecar 侧串行避免 Metal 争用
        failure_threshold: 3
        failure_cooldown_sec: 60
        # 下面三行是给现场调的入口:不预设"只看最近最大的人",按机位自己描述主体/场景。
        state: "画面共 {n} 张，按时间先后排列。第 1 张是「参考帧」，即上一个窗口的最后一帧；第 2 到第 {n} 张是「本窗口」的画面，每秒 1 张。"
        instructions: "相对参考帧，画面里**活动级的事件**变了吗？即主体或主要对象开始/结束/切换了一个活动，或进出画面、位置明显改变、物品交互、异常出现。不是动作级的小变化；同一活动持续、姿势/手脚/头部移动、打字、摸脸、托腮、转头、光线变化都不算。"
        # 机位须知只给 omni/特殊项提炼；门禁默认不注入（200 窗 A/B：客厅精度
        # 19.3%→21.8%、召回不变；玄关几乎不变）。需要时改 true 恢复。
        include_camera_prompt: false
        # hold 窗也过二级语义；过了才继续开窗/调 omni/落视频，否决则跳过。
        hold_semantic_gate: true
        # 「结束/离开」补问：补默认问题对「人消失/事件结束」不敏感。
        # 200 窗上 E@0.35 OR end@0.1：玄关 R72%→95%、P99%→95%；客厅不变。
        end_enabled: true
        end_instructions: "相对参考帧，主体/主要对象是否消失、离开画面，或结束了参考帧里正在做的事？（例如人离开/不见了、动作停止、物品放下、一件事结束）"
        end_min_score: 0.1
        # 生理关怀补问：状态容器 skip_omni 的小动作兜底（喝水/打哈欠等）。
        physio_enabled: true
        physio_instructions: "相对参考帧，主体是否出现**生理关怀相关动作**：喝水/喝饮料、吃东西、打哈欠、揉眼睛/明显疲劳、打瞌睡、捂肚子/身体不适、起身去卫生间？只判断身体/生理动作，工作动作不算。"
        physio_min_score: 0.1
        true_label: "有变化"
        false_label: "没有变化"
        # 特殊放行：用 omni LLM（model.omni 当前配置，text-only）读「本机位自定义任务
        # + 家庭档案」，只提炼默认问题覆盖不到的变化时刻（身份/身体条件、细微局部、
        # 宠物异常、健康安全禁忌等）；喝水/打哈欠/起身等常规活动由默认问题召回。
        # 提炼提示词会带上上面的 state（参考帧 + 本窗口各帧）和 instructions，
        # 静态/持续状态不输出。
        # 提炼按机位缓存，档案/规则/输入布局不变不重跑；失败只退回默认问题，不影响感知。
        special_pass:
          enabled: true
          max_items: 6             # 每机位最多几条特殊放行问题（覆盖短动作）
          refresh_after_hours: 24  # 档案/规则不变时也重跑一次的兜底周期
          retry_after_sec: 300     # 提炼失败后的重试间隔
          timeout_sec: 60          # 提炼 LLM 调用超时
          cache_path: ""           # 空 = $MILOCO_HOME/gate_special_pass.json
          max_action_chars: 60     # 单条动作描述长度上限
          extra_instructions: ""   # 追加到提炼提示词末尾的现场补充要求
      # 一级门禁窗口留存：过视觉门禁的窗口存 mp4 + meta，供离线分析。
      # 只写容器内暂存目录，宿主归档由同步脚本负责；max_disk_gb 是暂存上限。
      dump:
        enabled: false
        dir: ""                # 空 = $MILOCO_HOME/gate_dumps
        max_disk_gb: 1.0
        short_edge: 512
        include_audio: true
        include_hold: true     # hold 窗只有过了二级语义才落视频
    # Tracking 过线计数：直接用 tracker 的逐帧 track 框，不走 rule 边沿去重。
    # line/inside 用归一化坐标（0-1，与分辨率无关）；当前几何按玄关 C700 画面标定。
    track_count:
      enabled: false
      cameras:
        "1154253569":              # 玄关 C700
          # 只覆盖右侧门洞；门洞外的走廊横向走过不算进入/出去（算经过）
          line: [[0.72, 0.40], [1.0, 0.42]]
          inside: [0.5, 0.70]                # 室内侧任一点
          task_id: c700_gate_count
          pass_min_dx: 0.15                  # 门外横向位移 >= 此值算"经过"
          max_gap_sec: 8.0                   # 多久没再看到该 track 就结算
          line_deadband: 0.015               # 线附近死区，防框中心抖动误跨线
    # 上报状态记忆：新链只报一次、到点提醒；状态过滤交给本地 VLM 门禁，
    # 不做画面基线/帧差（2.4）。
    state_memory:
      enabled: true
      recheck_interval_sec: 300   # 状态还在时，多久强制放一窗给 omni 复核
    identity:
      # mock | real | deep_sort —— v1.2 主动注册默认 deep_sort,DeepSORT 内置
      # ReID 关联,跟踪更稳;额外暴露 Track.features deque 给陌生人池零额外推理
      # 取 emb。回退路径:切 "real" 启用纯 SORT(陌生人池退化为"只累积、不去重")。
      tracking_service_mode: "deep_sort"
    omni:
      timeout: 30.0 # 请求超时（秒）

    # 注：omni 身份识别系统（identity_engine）配置位于
    # ``perception/engine/identity/default_config.yaml``，本文件不维护其默认值。
    # 如需运维侧覆盖默认（少数场景），可在此追加 ``identity_engine:`` 块；
    # 加载时由 ``identity/config_loader.py::load_identity_engine_config`` 深合并。


# 消息投递调度参数
dispatcher:
  turn_wait_timeout_ms: 180000   # 同步等待单个 agent turn 结束的超时（毫秒）
  max_queue: 10                  # 每会话队列上限；超出按 (类型优先级, 条目级优先级, 入队时间) 淘汰最不紧急者
  message_ttl_sec: 300           # 待发送消息最大存活时长（秒）；入队龄超此值在入队/发送前清理，不再投递。<=0 关闭

# 可观测性
perf:
  enabled: true                # SQLite traces 采集开关
  retention:
    traces_days: 7             # traces / traces_device 表保留天数
    events_days: 7             # events 表保留天数
    agent_runs_days: 7         # agent_runs 表保留天数
    trace_jsonl_days: 7        # agent jsonl.gz 文件保留天数

# 产品级实验性功能开关（默认关，住户在 web 显式开启）
features:
  pet_recognition: false       # 宠物识别（实验性）总开关；关闭时前端隐藏入口、后端不注入宠物命名规则，已录数据保留
  pet_head_grounding: true     # 宠物头像头部定位子开关（默认开）；关则用全身 crop，仅在 pet_recognition 开启时有意义（内部调优，一般无需改动）
  pet_body_grounding: true     # 宠物本体定位子开关（默认开）；仅回退路径（框不到猫狗）用，裁本体作参考图，关则回退不产参考 crop（内部调优，一般无需改动）
  pet_reid_diverse: true       # 参考图多样性用人体 ReID 特征距离贪心选多姿态（默认开）；关或模型不可用回退 dHash，仅 pet_recognition 开时有意义（内部调优，一般无需改动）
